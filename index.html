<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>IS – Interstellar Signal · iki1uc</title>

<style>
body { background:#000; color:#0f0; font-family:monospace; padding:40px; }
.block { background:#111; border:1px solid #333; padding:25px; margin-bottom:30px; border-radius:8px; }
.title { font-size:22px; color:#6cf; margin-bottom:10px; }
pre { background:#000; border-left:3px solid #6cf; padding:15px; white-space:pre-wrap; }
</style>

<script type="module">
import { HUB_CORE } from "../HUB/HUB.core.js";
import { NC_QUANTUM } from "../NC/NC_Quantum.js";
import { PQ_HYPER } from "../PQ/PQ_Hyper.js";
import { TMP_GHOST } from "../TMP/TMP_Ghost.js";

import { ION_CORE } from "../ION/ion.core.js";
import { MIA_FUSION } from "../MIA/mia.core.js";
import { ECHO_CORE } from "../ECHO/EC.js";

import { IS_CORE } from "./IS.core.js";
import { IS_DASHBOARD } from "./IS.dashboard.js";

(async function(){

    const nc = NC_QUANTUM();
    const pq = PQ_HYPER(nc);
    const tmp = TMP_GHOST(pq);

    const hub = HUB_CORE(nc, pq, tmp);
    const ion = ION_CORE(hub);
    const mia = MIA_FUSION(hub, ion);
    const echo = ECHO_CORE(ion);

    const is = IS_CORE(echo);

    document.getElementById("is").innerText =
        JSON.stringify(IS_DASHBOARD(is), null, 2);

})();
</script>

</head>

<body>

<h1>IS – Interstellar Signal · iki1uc</h1>

<div class="block">
    <div class="title">IS‑Signal</div>
    <pre id="is"></pre>
</div>

</body>
</html>
